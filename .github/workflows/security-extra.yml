name: "Security Scan"

# 密钥泄露、依赖漏洞、静态分析。
# 上游用的 osv-scanner composite action 在非 Google 组织的仓库里 reporter 步骤必然失败，
# 这里换成直接 npm audit，避免整条流水线常年红叉。
on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"

  node-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      - name: Audit dependencies
        # 只有 critical 才阻断：上游依赖树里 high 级别的历史告警较多
        run: npm audit --audit-level=critical

  semgrep:
    name: Semgrep CE Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Semgrep CE
        run: |
          docker run --rm -v "${PWD}:/src" -w /src semgrep/semgrep:latest \
            semgrep scan --config p/default --config p/secrets \
            --sarif --output semgrep.sarif . || true

      - name: Upload Semgrep SARIF
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore

  actionlint:
    name: GitHub Actions Syntax Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
