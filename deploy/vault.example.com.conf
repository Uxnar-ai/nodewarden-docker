server
{
    listen 80;
    listen [::]:80;
    server_name vault.example.com;

    access_log /www/wwwlogs/vault.example.com.log;

    # 附件 / Send 文件上传上限
    client_max_body_size 100m;

    # Cloudflare Tunnel 会带 X-Forwarded-Proto；缺失时退回 $scheme
    set $nw_proto $http_x_forwarded_proto;
    if ($nw_proto = "") {
        set $nw_proto $scheme;
    }

    # wrangler dev 为了跑定时任务开了 /__scheduled 手动触发端点，
    # 暴露到公网等于让人随便触发备份任务，这里直接封掉。
    location ^~ /__scheduled {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:18787;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $nw_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # 通知推送 WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        proxy_buffering off;
        proxy_request_buffering off;

        proxy_connect_timeout 15s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
    }
}
