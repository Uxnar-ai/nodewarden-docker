# NodeWarden 反向代理示例（Nginx / 宝塔）
#
# 用法：宝塔 → 网站 → 你的站点 → 设置 → 配置文件，
# 把下面内容追加到 server { } 里（server_name 保持你原来的）。
#
# 假设容器映射在 127.0.0.1:18787。

# 上传附件 / Send 文件走这里，太小容易 413
client_max_body_size 100m;

# Cloudflare Tunnel 会把真实来源放在 X-Forwarded-Proto 里；
# 没有该头（直连 80）时退回 $scheme。注意 map 不能写在 server 块里，
# 所以这里用 set + if 的等价写法。
set $nw_proto $http_x_forwarded_proto;
if ($nw_proto = "") {
    set $nw_proto $scheme;
}

# wrangler dev 为跑定时任务暴露了手动触发端点，必须挡在公网之外
location ^~ /__scheduled {
    return 404;
}

location / {
    proxy_pass http://127.0.0.1:18787;
    proxy_http_version 1.1;

    # 后端只监听回环，这四个头必须传：
    #   Host              -> 决定 config 里的服务器地址、WebAuthn 校验
    #   X-Real-IP / CF-Connecting-IP -> 决定限流按谁计数（缺了所有人共用一份配额）
    #   X-Forwarded-Proto -> 决定生成的地址是 https 还是 http
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $nw_proto;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

    # 通知推送（WebSocket）
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;

    # 不缓冲，实时推送不被卡住
    proxy_buffering off;
    proxy_request_buffering off;

    proxy_connect_timeout 15s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
}

# 安全响应头（HTTPS 站点建议全开）
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;

# 密码库要随时同步，不要做 IP 白名单。
# 靠「强主密码 + 2FA + 邀请码注册」控制访问。
